<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En fase beta - Próximamente</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111 0%, #444 50%, #fff 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
    }
    .beta-container {
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }
    .beta-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }
    .beta-text {
      font-size: 1.2rem;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="beta-container">
    <div class="beta-title">En fase beta</div>
    <div class="beta-text">Próximamente</div>
  </div>
</body>
</html>
