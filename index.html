<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N.F.T.A- CORP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1 class="title">N.F.T.A- CORP</h1>
    <nav class="button-group">
      <a href="https://nfta-corp.com" class="btn" target="_blank">Página N.F.T.A-CORP</a>
      <a href="https://wa.me/1234567890" class="btn" target="_blank">WhatsApp</a>
      <a href="https://instagram.com/nfta-corp" class="btn" target="_blank">Instagram</a>
      <a href="https://twitter.com/nfta-corp" class="btn" target="_blank">Twitter</a>
      <a href="mailto:info@nfta-corp.com" class="btn" target="_blank">Contacto</a>
    </nav>
  </main>
  <footer class="footer">
    Created and designed by N.F.T.A-CORP
  </footer>
</body>
<style>
    body {
  min-height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #111 0%, #444 50%, #fff 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.title {
  font-size: 3rem;
  letter-spacing: 0.2em;
  font-weight: 700;
  margin-bottom: 2rem;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  text-align: center;
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  width: 100%;
  max-width: 320px;
}

.btn {
  background: rgba(255,255,255,0.08);
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 1rem 2rem;
  font-size: 1.1rem;
  text-align: center;
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.btn:hover, .btn:focus {
  background: #fff;
  color: #222;
  outline: none;
}

.footer {
  text-align: center;
  padding: 1rem 0;
  font-size: 1rem;
  color: #bbb;
  background: transparent;
  letter-spacing: 0.1em;
}

@media (max-width: 600px) {
  .title {
    font-size: 2rem;
  }
  .button-group {
    max-width: 90vw;
  }
  .btn {
    font-size: 1rem;
    padding: 0.8rem 1rem;
  }
}
</style>
</html>
